# Auto-generated config for WASP-94
# Transit time (t0) automatically assigned: 60595.21

planet:
  name: WASP-94
  period: 3.9502001
  duration: 0.189675
  t0: 60595.21518
  b: 0.15
  rprs: 0.107
  a_rs: 7.299998525 # Derived from this config's transit geometry
  ecc: 0.0 # NASA Exoplanet Archive PSCompPars, queried 2026-08-11
  omega: 0.0 # radians; PSCompPars pl_orblper
stellar:
  feh: 0.37
  teff: 6217
  logg: 4.27
  ld_model: "stagger"
  ld_data_path: "../exotic_ld_data"

instrument: 'NIRISS/SOSS'
order: 1
path: '/scratch/midway3/tfairnington/'
input_dir: 'FITS'
output_dir: 'ASYMM_WASP-94_SOSS_ORDER1_FIXEDLD_QUADRATIC_LINEAR'
fits_file: 'WASP-94_box_spectra_fullres.fits'
resolution:
  high: 50 # NIRISS harmonica high-resolution fit
  low: 20
  reference_grid: 'prism_template.csv'
flags:
  transit_engine: 'harmonica'
  harmonica_max_order: 1
  spectro_sampling_mode: 'independent'
  vmap_chunk: 4
  harmonica_spectro_parameterization: 'delta_r'
  harmonica_spectro_fit_jitter: False
  harmonica_spectro_odd_frac_sigma: 0.1
  detrending_type: 'linear'
  interpolate_trend: False
  interpolate_ld: False
  fix_ld: True
  need_lowres: False
  ld_profile: 'quadratic'
  mask_start: 'jnp.min(t)'
  mask_end: 'jnp.min(t) + 0.0208'
  #mask_integrations_start: 300
  #mask_integrations_end:
outlier_clip:
  whitelight_sigma: 5
  spectroscopic_sigma: 5

host_device: "gpu"
