# WASP-94 SOSS order 1 Harmonica run with the standard quadratic law.
# The stellar-model values are used directly as fixed (u1, u2) coefficients:
# I(mu) = 1 - u1(1-mu) - u2(1-mu)^2. This is not a Kipping transform.

planet:
  name: WASP-94
  period: 3.9502001
  duration: 0.189675
  t0: 60595.21518
  b: 0.15
  rprs: 0.107
  a_rs: 7.3
  ecc: 0.0
  omega: 0.0

stellar:
  feh: 0.26
  teff: 6153.0
  logg: 4.18
  ld_model: "stagger"
  ld_data_path: "../exotic_ld_data"

instrument: "NIRISS/SOSS"
order: 1
path: "/scratch/midway3/tfairnington/"
input_dir: "FITS"
output_dir: "HARMONICA_ACCEL_WASP94_DUMP_20260902"
fits_file: "WASP-94_box_spectra_fullres.fits"

resolution:
  high: 50
  low: 20

flags:
  transit_engine: "harmonica"
  harmonica_max_order: 1
  spectro_sampling_mode: "independent"
  vmap_chunk: 4
  harmonica_spectro_parameterization: "delta_r"
  harmonica_spectro_fit_jitter: false
  harmonica_spectro_odd_frac_sigma: 0.1
  detrending_type: "linear"
  interpolate_trend: false
  interpolate_ld: false
  fix_ld: true
  ld_prior: "fixed"
  need_lowres: true
  ld_profile: "quadratic"
  mask_start: "jnp.min(t)"
  mask_end: "jnp.min(t) + 0.007"

outlier_clip:
  whitelight_sigma: 5
  spectroscopic_sigma: 5

host_device: "gpu"
