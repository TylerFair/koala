# Auto-generated config for WASP-17 Visit 2
# Transit time (t0) automatically assigned: 60023.7

planet:
  name: WASP-17
  period: 3.73548545
  duration: 0.17258333333333334
  t0: 60023.7
  b: 0.18
  rprs: 0.1235
  a_rs: 7.669558934 # Derived from this config's transit geometry
  ecc: 0.0 # NASA Exoplanet Archive PSCompPars, queried 2026-08-11
  omega: -1.441641962 # radians; PSCompPars pl_orblper

stellar:
  feh: -0.01
  teff: 6793
  logg: 4.59
  ld_model: "stagger"
  ld_data_path: "../exotic_ld_data"

#wavelength_masks: [1.525, 1.575, 1.64, 1.70, 1.992, 2.12]

instrument: 'NIRISS/SOSS'
order: 2
path: '/scratch/midway3/tfairnington/'
input_dir: 'FITS'
output_dir: 'ASYMM_WASP-17_SOSS_ORDER2_V2_FIXEDLD_QUADRATIC_LINEAR'
fits_file: 'WASP-17_box_spectra_fullres.fits'
resolution:
  high: 50 # NIRISS harmonica high-resolution fit
  low: 20
  reference_grid: 'prism_template.csv'
flags:
  transit_engine: 'harmonica'
  harmonica_max_order: 1
  spectro_sampling_mode: 'independent'
  vmap_chunk: 4
  harmonica_spectro_parameterization: 'delta_r'
  harmonica_spectro_fit_jitter: False
  harmonica_spectro_odd_frac_sigma: 0.1
  detrending_type: 'linear'
  interpolate_trend: False
  interpolate_ld: False
  fix_ld: True
  need_lowres: False
  ld_profile: 'quadratic'
  mask_start: 'jnp.min(t)'
  mask_end: 'jnp.min(t) + 0.017'
  mask_integrations_start: None
  #mask_integrations_end:
outlier_clip:
  whitelight_sigma: 5
  spectroscopic_sigma: 5

host_device: "gpu"
