# Auto-generated config for HAT-P-26
# Transit time (t0) automatically assigned: 60309.4

planet:
  name: HAT-P-26
  period: 4.2345002
  duration: 0.1023
  t0: 60127.25
  b: 0.355
  rprs: 0.0737
  a_rs: 12.22180288 # Derived from this config's transit geometry
  ecc: 0.12 # NASA Exoplanet Archive PSCompPars, queried 2026-08-11
  omega: 0.8028514559 # radians; PSCompPars pl_orblper

stellar:
  feh: 0.01
  teff: 5001
  logg: 4.21
  ld_model: "stagger"
  ld_data_path: "../exotic_ld_data"

instrument: 'NIRISS/SOSS'
order: 1
path: '/scratch/midway3/tfairnington/'
input_dir: 'FITS'
output_dir: 'ASYMM_HAT-P-26_SOSS_ORDER1_FIXEDLD_QUADRATIC_LINEAR'
fits_file: 'HAT-P-26_box_spectra_fullres.fits'
resolution:
  high: 50 # NIRISS harmonica high-resolution fit
  low: 20
  reference_grid: 'prism_template.csv'
flags:
  transit_engine: 'harmonica'
  harmonica_max_order: 1
  spectro_sampling_mode: 'independent'
  vmap_chunk: 4
  harmonica_spectro_parameterization: 'delta_r'
  harmonica_spectro_fit_jitter: False
  harmonica_spectro_odd_frac_sigma: 0.1
  detrending_type: 'linear'
  interpolate_trend: False
  interpolate_ld: False
  fix_ld: True
  need_lowres: False
  ld_profile: 'quadratic'
  mask_start: 'jnp.min(t)'
  mask_end: 'jnp.min(t) + 0.007'
  mask_integrations_start: None
  #mask_integrations_end:
outlier_clip:
  whitelight_sigma: 5
  spectroscopic_sigma: 5

host_device: "gpu"
