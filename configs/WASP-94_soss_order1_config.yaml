# Auto-generated config for WASP-94
# Transit time (t0) automatically assigned: 60595.21

planet:
  name: WASP-94
  period: 3.9502001
  duration: 0.189675
  t0: 60595.21518
  b: 0.15
  rprs: 0.107
  a_rs: 7.3 # Semi-major axis / stellar radius (used by harmonica engine)
  ecc: 0.0 # Eccentricity (used by harmonica engine)
  omega: 0.0 # Argument of periastron [radians] (used by harmonica engine)
stellar:
  feh: 0.26
  teff: 6153.0
  logg: 4.18
  ld_model: "stagger"
  ld_data_path: "../exotic_ld_data"

instrument: 'NIRISS/SOSS'
order: 1
path: '/scratch/midway3/tfairnington/'
input_dir: 'FITS'
output_dir: 'GPU_HARMONICA_WASP-94_SOSS_ORDER1_GAUSSIANLD_POWER2_LINEAR'
fits_file: 'WASP-94_box_spectra_fullres.fits'
resolution:
  high: 50
  low: 20
  #  reference_grid: 'prism_template.csv'
flags:
  transit_engine: 'harmonica'
  harmonica_max_order: 1
  #vmap_chunk: 50
  detrending_type: 'linear'
  interpolate_trend: False
  interpolate_ld: False
  fix_ld: True
  need_lowres: False
  ld_profile: 'power2'
  mask_start: 'jnp.min(t)'
  mask_end: 'jnp.min(t) + 0.0208'
  #mask_integrations_start: 300
  #mask_integrations_end:
outlier_clip:
  whitelight_sigma: 5
  spectroscopic_sigma: 5

host_device: "gpu"
