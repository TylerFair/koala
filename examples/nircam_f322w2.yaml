# HAT-P-18 b, NIRCam/F322W2 grism time series. Same model as the G395M example;
# NIRCam has no detector or order key.

planet:
  name: HAT-P-18
  period: 5.50802941
  duration: 0.10999998
  t0: 60795.39
  b: 0.148
  rprs: 0.1356

stellar:
  teff: 4710
  logg: 4.17
  feh: 0.06
  teff_sigma: 238
  logg_sigma: 0.58
  feh_sigma: 0.08
  ld_model: "stagger"
  ld_data_path: "../exotic_ld_data"

instrument: 'NIRCAM/F322W2'   # or NIRCAM/F444W

path: '/path/to/work'
input_dir: 'FITS'
input_file: 'HAT-P-18_box_spectra_fullres_F322W2.fits'
output_dir: 'HAT-P-18_F322W2'

resolution:
  low: 20
  high: 'reference'
  reference_grid: 'prism_template.csv'

flags:
  detrending_type: 'linear'
  ld_profile: 'power2'
  ld_prior: 'stellarprior'
  mask_start: 60795.15    # drop cadences between these times (BMJD_TDB)
  mask_end: 60795.26

outlier_clip:
  whitelight_sigma: 5
  spectroscopic_sigma: 5

host_device: "gpu"
