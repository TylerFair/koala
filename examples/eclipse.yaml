# Small secondary-eclipse recovery example. Generate its input from the repo
# root with: python tools/example_phase_curves.py eclipse
planet:
  name: Synthetic-Eclipse
  period: 2.0
  t0: 60000.0
  b: 0.25
  rprs: 0.10
  a_rs: 6.0
  ecc: 0.0
  omega: 0.0
  eclipse_depth_ppm: 900.0
  eclipse_depth_prior_width_ppm: 250.0

stellar:
  ld_coefficients: [0.3, 0.2]

instrument: NIRSPEC/G395M
nrs: 1
path: .
input_dir: examples/data/generated
input_file: synthetic_eclipse.fits
output_dir: results/synthetic_eclipse

resolution:
  low: 20
  high: native

flags:
  light_curve_model: eclipse
  fit_geometry: false
  transit_engine: jaxoplanet
  detrending_type: linear
  ld_profile: quadratic
  ld_prior: fixed
  random_seed: 20260904
  spectro_chunk_size: 4

outlier_clip:
  whitelight_sigma: 5
  spectroscopic_sigma: 5

host_device: cpu
