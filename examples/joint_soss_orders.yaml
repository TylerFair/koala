# One orbit fitted to both SOSS orders of the WASP-39 b example, then the spectrum of each.
# Run from the top of the repository with: koala -c examples/joint_soss_orders.yaml
# The member paths and output_dir are relative to this file.

joint:
  members: [joint_soss_order1.yaml, joint_soss_order2.yaml]
planet:
  a_rs: {value: 11.4, prior: uniform, low: 5.0, high: 25.0}
  b: {value: 0.45, prior: uniform, low: 0.0, high: 1.0}
output_dir: ../results/WASP-39_joint
