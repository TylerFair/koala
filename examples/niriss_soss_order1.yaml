# WASP-39 b, NIRISS/SOSS order 1, power-2 limb darkening with `stellarprior`,
# linear baseline. This is the standard starting point for a SOSS transit.

planet:
  # Every planet parameter is {value, prior[, sigma, low, high]}; prior is fixed, uniform, log_uniform, or gaussian.
  name: WASP-39
  period: {value: 4.05528043, prior: fixed}      # days
  duration: {value: 0.11693087, prior: log_uniform, low: 0.01, high: 1.0}    # days
  t0: {value: 59787.055, prior: uniform, low: 59787.005, high: 59787.105}           # BMJD_TDB
  b: {value: 0.4498, prior: uniform, low: 0.0, high: 1.5}
  rprs: {value: 0.1457, prior: uniform, low: 0.01, high: 0.5}

stellar:
  teff: 5509
  logg: 4.22
  feh: 0.04
  teff_sigma: 28          # propagated into the limb-darkening prior
  logg_sigma: 0.07
  feh_sigma: 0.02
  ld_model: "stagger"
  ld_data_path: "exotic_ld_data"  # downloaded automatically on first use

instrument: 'NIRISS/SOSS'
order: 1

path: '.'
input_dir: 'examples/data'
input_file: 'WASP-39_soss_binned8.fits'
output_dir: 'results/WASP-39_SOSS_ORDER1'

resolution:
  low: 20                           # optional coarse bridge/check; remove to skip it
  high: 100                          # constant resolving power; no grid file needed

flags:
  detrending_type: 'linear'
  ld_profile: 'power2'
  ld_prior: 'stellarprior'

outlier_clip:
  whitelight_sigma: 5
  spectroscopic_sigma: 5

host_device: "cpu"                    # portable default; use "gpu" for production
