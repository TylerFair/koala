# WASP-39 b with NIRISS/SOSS order 2, as one half of joint_soss_orders.yaml.
# Order 2 is only used below 0.85 um, where order 1 doesn't reach.

planet:
  name: WASP-39
  period: {value: 4.05528043, prior: fixed}                                  # days
  t0: {value: 59787.055, prior: uniform, low: 59787.005, high: 59787.105}    # BMJD_TDB
  duration: {value: 0.117, prior: log_uniform, low: 0.01, high: 1.0}         # days
  b: {value: 0.45, prior: uniform, low: 0.0, high: 1.5}
  rprs: {value: 0.146, prior: uniform, low: 0.01, high: 0.5}

stellar:
  teff: 5509
  logg: 4.22
  feh: 0.04

instrument: NIRISS/SOSS
order: 2
wavelength_filter:
  wl_min_o2: 0.6
  wl_max_o2: 0.85

input_file: examples/data/WASP-39_soss_binned8.fits
output_dir: results/WASP-39_SOSS_ORDER2

resolution:
  high: 100
