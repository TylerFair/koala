# WASP-121 b, NIRSpec/G395H NRS1. Supply the matching extracted spectra.

planet:
  name: WASP-121
  period: 1.274924762
  duration: 0.11595833333333333
  t0: 59867.1426
  b: 0.1
  rprs: 0.122551

stellar:
  teff: 6827
  logg: 4.64
  feh: 0.46
  teff_sigma: 72
  logg_sigma: 0.06
  feh_sigma: 0.05
  ld_model: stagger
  ld_data_path: /path/to/exotic_ld_data

instrument: NIRSPEC/G395H
nrs: 1

path: /path/to/work
input_dir: FITS
input_file: WASP-121_nrs1_box_spectra_fullres_G395H.fits
output_dir: results/WASP-121_G395H_NRS1

resolution:
  low: 20
  high: 100

flags:
  detrending_type: quadratic
  ld_profile: power2
  ld_prior: stellarprior

outlier_clip:
  whitelight_sigma: 5
  spectroscopic_sigma: 5

host_device: cpu
