# One-orbit thermal phase curve with a secondary eclipse and transit. Generate
# its input from the repo root with: python tools/example_phase_curves.py phase_curve
planet:
  name: Synthetic-Phase-Curve
  period: 2.0
  t0: 60000.0
  b: 0.25
  rprs: 0.10
  a_rs: 6.0
  ecc: 0.0
  omega: 0.0
  dayside_flux_ppm: 1000.0
  dayside_flux_prior_width_ppm: 150.0
  nightside_flux_ppm: 300.0
  nightside_flux_prior_width_ppm: 75.0
  hotspot_offset_deg: 18.0
  hotspot_offset_prior_width_deg: 10.0

stellar:
  ld_coefficients: [0.3, 0.2]

instrument: NIRSPEC/G395M
nrs: 1
path: .
input_dir: examples/data/generated
input_file: synthetic_phase_curve.fits
output_dir: results/synthetic_phase_curve

resolution:
  low: 20
  high: native

flags:
  light_curve_model: phase_curve
  fit_geometry: false
  transit_engine: jaxoplanet
  detrending_type: linear
  ld_profile: quadratic
  ld_prior: fixed
  random_seed: 20260904
  spectro_chunk_size: 4

outlier_clip:
  whitelight_sigma: 5
  spectroscopic_sigma: 5

host_device: cpu
