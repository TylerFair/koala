# Jaxoplanet/Power-2 CPU harness derivative of the fiducial HAT-P-65 PRISM config.
planet:
  name: HAT-P-65
  period: 2.60544751
  duration: 0.17688375
  t0: 60470.72
  b: 0.464
  rprs: 0.1006

stellar:
  feh: 0.1
  teff: 5835
  logg: 4.18
  ld_model: "stagger"
  ld_data_path: "../exotic_ld_data"

instrument: 'NIRSPEC/PRISM'
order: null
nrs: 1
path: '/scratch/midway3/tfairnington/'
input_dir: 'FITS'
output_dir: 'HAT-P-65_PRISM_NRS1_V1_FIXEDLD_POWER2_EXPLINEAR_ACCEL'
fits_file: 'HAT-P-65_nrs1_box_spectra_fullres_PRISM_V1.fits'
resolution:
  high: 50
  low: 10
flags:
  transit_engine: 'jaxoplanet'
  vmap_chunk: 40
  detrending_type: 'explinear'
  interpolate_trend: false
  interpolate_ld: false
  fix_ld: true
  need_lowres: true
  ld_profile: 'power2'
  mask_integrations_start: null
  # Short CPU-only geometry fit for harness generation.
  whitelight_num_warmup: 20
  whitelight_num_samples: 20
outlier_clip:
  whitelight_sigma: 4
  spectroscopic_sigma: 4

host_device: "cpu"
