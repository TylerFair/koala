name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.10", "3.11"]' || '["3.10"]') }}
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      XLA_FLAGS: --xla_force_host_platform_device_count=1 --xla_cpu_multi_thread_eigen=false
      # Avoid unnecessary bytecode writes during the clean source install.
      PIP_NO_COMPILE: "1"
      PIP_CONSTRAINT: ${{ github.workspace }}/tests/requirements-ci.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            tests/requirements-ci.txt
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-xdist batman-package
      - name: Check the Harmonica dependency and CPU backend
        run: |
          python - <<'PYTHON'
          import jax
          from harmonica import bindings
          from harmonica.jax import harmonica_transit_power2_ld, harmonica_transit_quad_ld
          assert jax.default_backend() == "cpu"
          print(jax.__version__, jax.devices(), bindings.__file__)
          PYTHON
      - name: Run isolated test files
        run: |
          python tests/run_ci.py --shard ${{ matrix.shard }} --shards 8 \
            --output "$RUNNER_TEMP/koala-ci/shard-${{ matrix.shard }}"
      - name: Save per-file failures, durations, and peak memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-py${{ matrix.python-version }}-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/koala-ci/
          if-no-files-found: warn
