# Read the Docs configuration for Koala.
# The docs are static Markdown (no autodoc), so the build only needs Sphinx
# and its extensions; Koala itself and its compiled Harmonica extension are
# not installed on the docs builder.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - htmlzip

python:
  install:
    - requirements: docs/requirements.txt
